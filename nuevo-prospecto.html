<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Kinsu - Nuevo Prospecto de Salud</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#eef2f9; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; vertical-align:middle; }
  .ana-bubble  { border-radius:16px 16px 16px 4px; }
  .user-bubble { border-radius:16px 16px 4px 16px; }
  .no-scrollbar::-webkit-scrollbar { display:none; }
  .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

  /* Animación de esferas de escritura con color corporativo */
  .dot { width:6px; height:6px; border-radius:50%; background:#4575BA; display:inline-block; animation:blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay:.2s; }
  .dot:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,100%{ opacity:.3; transform:scale(.8); } 50%{ opacity:1; transform:scale(1); } }

  /* Chips de respuestas rápidas táctiles */
  .qr-chip {
    flex-shrink:0; padding:8px 18px; border-radius:99px;
    font-size:13px; font-weight:600; cursor:pointer;
    transition:all .15s; white-space:nowrap;
  }
  .qr-primary { background:#4575BA; color:#fff; box-shadow:0 4px 12px rgba(69,117,186,.25); }
  .qr-primary:hover { background:#355c94; }
  .qr-secondary { background:#fff; color:#4575BA; border:1.5px solid rgba(69,117,186,.2); }
  .qr-secondary:hover { background:#f4f7fc; }
  
  /* Bloqueo de zoom automático en Safari/Chrome iOS */
  #chat-input { font-size: 16px !important; }
  @media (min-width: 640px) { #chat-input { font-size: 14px !important; } }
</style>
</head>

<body class="min-h-screen flex flex-col select-none">

<header class="bg-white/90 backdrop-blur-md fixed top-0 w-full z-50 border-b border-[#edf1f6]">
  <div class="flex items-center justify-between px-4 h-16 max-w-2xl mx-auto">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='dashboard.html'" class="text-[#4575BA] hover:bg-slate-100 p-2 rounded-full transition-all">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 relative"
        style="background:linear-gradient(135deg,#4575BA 0%,#BFFD70 100%);">
        <span class="text-white font-black text-base">A</span>
        <div class="absolute bottom-0 right-0 w-3 h-3 bg-[#BFFD70] border-2 border-white rounded-full"></div>
      </div>
      <div>
        <p class="text-[13px] font-bold text-[#0d1c2e]">Ana · Asistente Kinsu</p>
        <div class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-[#BFFD70] rounded-full"></span>
          <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">En línea</span>
        </div>
      </div>
    </div>
    <span class="px-3 py-1 bg-slate-100 text-[#4575BA] rounded-full text-[10px] font-bold uppercase tracking-wider">
      GMM Familiar
    </span>
  </div>
</header>

<div class="bg-[#edf1f6] border-b border-[#e4e8ee] fixed top-16 w-full z-40">
  <div class="flex items-center justify-between px-4 py-2.5 max-w-2xl mx-auto">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-[#4575BA] text-[18px]">assignment_ind</span>
      <span class="text-[13px] text-[#4575BA] font-semibold" id="progress-label">Fase 1: Datos del Titular</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[11px] text-[#4575BA] font-bold" id="progress-pct">0%</span>
      <div class="w-24 h-1.5 bg-slate-200 rounded-full overflow-hidden">
        <div class="h-full bg-[#4575BA] rounded-full transition-all duration-500" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
  </div>
</div>

<main class="flex-1 max-w-2xl w-full mx-auto pt-32 pb-48 px-4 flex flex-col gap-4 no-scrollbar overflow-y-auto" id="chat-area"></main>

<div class="fixed w-full max-w-2xl left-1/2 -translate-x-1/2 px-4 z-40" id="quick-replies-container" style="bottom:100px;"></div>

<div class="fixed bottom-0 left-0 w-full z-50">
  <div class="max-w-2xl mx-auto px-4 pb-6 pt-2">
    <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-2 shadow-lg flex items-center gap-2 border border-white">
      <input id="chat-input" type="text" placeholder="Escribe tu respuesta..."
        class="flex-1 bg-transparent border-none focus:ring-0 text-[14px] text-[#0d1c2e] placeholder:text-slate-400 px-2 outline-none">
      <button onclick="sendUserMessage()" id="send-btn"
        class="w-10 h-10 bg-[#4575BA] text-white rounded-full flex items-center justify-center shadow active:scale-90 transition-transform flex-shrink-0">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">arrow_upward</span>
      </button>
    </div>
  </div>
</div>

<script src="kinsu-config.js"></script>
<script>
const user     = JSON.parse(sessionStorage.getItem('user') || '{"nombre":"Kinsurer","kinsurerID":"KIN-0001"}');
const userName = (user.nombre || 'Kinsurer').split(' ')[0];

// ══════════════════════════════════════════════════
// MÁQUINA DE ESTADOS COMPLETA (PROMPT A - REQ 1)
// ══════════════════════════════════════════════════
const chatState = {
    currentStep: 'INTRO',
    titular: {},
    familiares: [],
    tempFamiliar: {},
    estatusProgreso: 0
};

const ANA_FLOW = {
    'INTRO': {
        q: () => `Hola ${userName}! 👋 Vamos a registrar un nuevo prospecto para un *Seguro de Gastos Médicos Mayores (GMM)*.\n\nComo es nuestro producto estrella, realizaremos un perfilamiento médico completo para cotizar con precisión. ¿Me ayudas con el *Nombre Completo* de tu referido?`,
        placeholder: 'Ej. María García López',
        key: 'nombre',
        next: 'TITULAR_TEL'
    },
    'TITULAR_TEL': {
        q: () => `Perfecto. ¿Cuál es su número de teléfono o WhatsApp de contacto?`,
        placeholder: 'Ej. 55 1234 5678',
        key: 'tel',
        next: 'TITULAR_EMAIL'
    },
    'TITULAR_EMAIL': {
        q: () => `¿Tienes su correo electrónico corporativo o personal?`,
        placeholder: 'Ej. maria@correo.com o escribe "No tiene"',
        key: 'correo',
        replies: ['No tiene correo'],
        next: 'TITULAR_FNAC'
    },
    'TITULAR_FNAC': {
        q: () => `¿Cuál es la fecha de nacimiento de *${chatState.titular.nombre}*? (Formato AAAA-MM-DD o su edad aproximada)`,
        placeholder: 'Ej. 1992-05-14 o 34 años',
        key: 'fnac',
        next: 'TITULAR_GENERO'
    },
    'TITULAR_GENERO': {
        q: () => `¿Cuál es el género asignado al nacer de *${chatState.titular.nombre}*?`,
        placeholder: 'Selecciona una opción...',
        key: 'genero',
        replies: ['Masculino', 'Femenino'],
        next: (val) => val === 'Femenino' ? 'TITULAR_MATERNIDAD' : 'TITULAR_CP'
    },
    'TITULAR_MATERNIDAD': {
        q: () => `¿*${chatState.titular.nombre}* requiere la inclusión de cobertura por Maternidad y complicaciones del embarazo?`,
        placeholder: 'Selecciona una respuesta...',
        key: 'maternidad',
        replies: ['Sí, incluir maternidad', 'No la requiere'],
        next: 'TITULAR_CP'
    },
    'TITULAR_CP': {
        q: () => `¿Cuál es el Código Postal (CP) o la Ciudad donde reside actualmente *${chatState.titular.nombre}*?`,
        placeholder: 'Ej. 06700, CDMX',
        key: 'cp',
        replies: ['CDMX', 'Monterrey', 'Guadalajara'],
        next: 'TITULAR_OCUPACION'
    },
    'TITULAR_OCUPACION': {
        q: () => `¿Cuál es la profesión u ocupación laboral principal de *${chatState.titular.nombre}*?`,
        placeholder: 'Ej. Arquitecto, Consultor, Comerciante...',
        key: 'ocupacion',
        next: 'TITULAR_DEPORTE'
    },
    'TITULAR_DEPORTE': {
        q: () => `¿Practica algún deporte o actividad física de alto riesgo de forma recurrente? (Ej. Motociclismo, buceo, o selecciona "Ninguno")`,
        placeholder: 'Especifica la actividad o escribe Ninguno',
        key: 'deporte',
        replies: ['Ninguno', 'Fútbol regular', 'Crossfit / Fitness'],
        next: 'TITULAR_ANTRO'
    },
    'TITULAR_ANTRO': {
        q: () => `Para calcular su índice de masa corporal de referencia, confírmame su Peso aproximado en kg y su Estatura en cm:`,
        placeholder: 'Ej. 70 kg, 165 cm',
        key: 'antro',
        next: 'TITULAR_PREEXISTENCIA'
    },
    'TITULAR_PREEXISTENCIA': {
        q: () => `¿*${chatState.titular.nombre}* sufre actualmente o tiene historial de alguna condición médica o enfermedad preexistente?`,
        placeholder: 'Selecciona o especifica el padecimiento...',
        key: 'preexistencia',
        replies: ['Sin preexistencias', 'Diabetes', 'Hipertensión', 'Otra condición'],
        next: 'PREGUNTA_DEPENDIENTE'
    },
    // --- COMPONENTE MULTI-PERSONA (HASTA 4 FAMILIARES ADICIONALES) ---
    'PREGUNTA_DEPENDIENTE': {
        q: () => chatState.familiares.length === 0 
            ? `¿Deseas agregar a algún familiar o dependiente directo a esta misma póliza de salud?`
            : `¿Deseas sumar a otro familiar a la cotización? (Llevas ${chatState.familiares.length} de 4 familiares permitidos)`,
        placeholder: 'Selecciona una opción...',
        key: 'quiere_familiar',
        replies: ['Sí, agregar familiar', 'No, finalizar y guardar'],
        next: (val) => val.includes('Sí') ? 'FAMILIAR_NOMBRE' : 'FINALIZAR'
    },
    'FAMILIAR_NOMBRE': {
        q: () => `Ingresa el nombre completo del familiar número ${chatState.familiares.length + 1}:`,
        placeholder: 'Nombre del familiar',
        key: 'nombre',
        next: 'FAMILIAR_FNAC'
    },
    'FAMILIAR_FNAC': {
        q: () => `¿Cuál es la fecha de nacimiento o edad de este dependiente?`,
        placeholder: 'Ej. 1996-03-22 o 30 años',
        key: 'fnac',
        next: 'FAMILIAR_GENERO'
    },
    'FAMILIAR_GENERO': {
        q: () => `¿Cuál es su género asignado al nacer?`,
        placeholder: 'Selecciona una opción...',
        key: 'genero',
        replies: ['Masculino', 'Femenino'],
        next: 'FAMILIAR_ANTRO'
    },
    'FAMILIAR_ANTRO': {
        q: () => `¿Cuál es su Peso (kg) y Estatura (cm)?`,
        placeholder: 'Ej. 55 kg, 158 cm',
        key: 'antro',
        next: 'FAMILIAR_PREEXISTENCIA'
    },
    'FAMILIAR_PREEXISTENCIA': {
        q: () => `¿Este familiar cuenta con algún padecimiento o condición médica preexistente?`,
        placeholder: 'Selecciona o escribe...',
        key: 'preexistencia',
        replies: ['Sin preexistencias', 'Diabetes', 'Hipertensión', 'Otra'],
        next: (val) => {
            chatState.familiares.push({ ...chatState.tempFamiliar });
            chatState.tempFamiliar = {}; // Liberar buffer temporal
            
            if (chatState.familiares.length >= 4) {
                return 'FINALIZAR';
            }
            return 'PREGUNTA_DEPENDIENTE';
        }
    }
};

let typing = false;
let folio  = '';

// ── UI Control Mechanics ──
function scrollBottom() {
  const area = document.getElementById('chat-area');
  setTimeout(() => area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' }), 80);
}

function addBubble(html, side = 'ana') {
  const area = document.getElementById('chat-area');
  if (side === 'ana') {
    area.innerHTML += `
    <div class="flex items-end gap-2 max-w-[88%] animate-fade-in">
      <div class="w-8 h-8 rounded-full flex-shrink-0 self-start mt-1 flex items-center justify-center"
        style="background:linear-gradient(135deg,#4575BA 0%,#BFFD70 100%);">
        <span class="text-white font-bold text-[11px]">A</span>
      </div>
      <div class="bg-white ana-bubble border border-slate-200 px-4 py-3 text-[14px] text-[#0d1c2e] leading-relaxed shadow-sm">
        ${html}
      </div>
    </div>`;
  } else {
    area.innerHTML += `
    <div class="flex justify-end">
      <div class="bg-[#4575BA] text-white px-4 py-3 text-[14px] leading-relaxed max-w-[80%] user-bubble shadow-sm">
        ${html}
      </div>
    </div>`;
  }
  scrollBottom();
}

function showTyping() {
  const area = document.getElementById('chat-area');
  area.innerHTML += `
  <div class="flex items-end gap-2" id="typing-indicator">
    <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center" style="background:rgba(69,117,186,0.15);">
      <span class="text-[#4575BA] font-bold text-[11px]">A</span>
    </div>
    <div class="bg-white px-4 py-3 shadow-sm border border-slate-200/60 ana-bubble">
      <div style="display:flex;gap:4px;align-items:center;">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  </div>`;
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function setQuickReplies(replies) {
  const c = document.getElementById('quick-replies-container');
  if (!replies || !replies.length) { c.innerHTML = ''; return; }
  c.innerHTML = `<div class="flex gap-2 overflow-x-auto no-scrollbar py-2">${
    replies.map((r, i) =>
      `<button class="qr-chip qr-secondary" onclick="onQuickReply('${r.replace(/'/g,"\\'")}')">
        ${r}
      </button>`
    ).join('')
  }</div>`;
}

function clearQuickReplies() {
  document.getElementById('quick-replies-container').innerHTML = '';
}

function updateProgressUI() {
  let pct = 5;
  const step = chatState.currentStep;
  const label = document.getElementById('progress-label');

  if (step === 'INTRO' || step.startsWith('TITULAR')) {
      label.textContent = "Fase 1: Perfil del Titular";
      if (step === 'TITULAR_FNAC') pct = 20;
      if (step === 'TITULAR_CP') pct = 45;
      if (step === 'TITULAR_PREEXISTENCIA') pct = 65;
  } else if (step === 'PREGUNTA_DEPENDIENTE') {
      label.textContent = "Fase 2: Dependientes Familiares";
      pct = 75;
  } else if (step.startsWith('FAMILIAR')) {
      label.textContent = `Fase 2: Familiar #${chatState.familiares.length + 1}`;
      pct = 80 + (chatState.familiares.length * 4);
  }
  
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = pct + '%';
}

// ── Core Conversational Engine ──
function askNextQuestion() {
    const currentConfig = ANA_FLOW[chatState.currentStep];
    if (!currentConfig) {
        finishFlow();
        return;
    }

    updateProgressUI();
    typing = true;
    showTyping();

    setTimeout(() => {
        removeTyping();
        typing = false;
        
        const promptText = currentConfig.q();
        addBubble(promptText.replace(/\n/g, '<br>'));
        
        setQuickReplies(currentConfig.replies || []);
        document.getElementById('chat-input').placeholder = currentConfig.placeholder || 'Escribe tu respuesta...';
        scrollBottom();
    }, 600 + Math.random() * 350);
}

function handleAnswer(answer) {
    if (typing || !answer.trim()) return;
    
    clearQuickReplies();
    addBubble(answer, 'user');

    const currentConfig = ANA_FLOW[chatState.currentStep];
    
    if (chatState.currentStep === 'INTRO' || chatState.currentStep.startsWith('TITULAR')) {
        chatState.titular[currentConfig.key] = answer;
    } else if (chatState.currentStep.startsWith('FAMILIAR')) {
        chatState.tempFamiliar[currentConfig.key] = answer;
    }

    let nextStep;
    if (typeof currentConfig.next === 'function') {
        nextStep = currentConfig.next(answer);
    } else {
        nextStep = currentConfig.next;
    }

    chatState.currentStep = nextStep;
    askNextQuestion();
}

function sendUserMessage() {
  const inp = document.getElementById('chat-input');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  handleAnswer(val);
}

function onQuickReply(val) {
  document.getElementById('chat-input').value = '';
  handleAnswer(val);
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendUserMessage();
});

// ══════════════════════════════════════════════════
// STRUCTURAL MINUTE GENERATOR (OPCIÓN A)
// ══════════════════════════════════════════════════
function compilarNotasExtendidas() {
  const t = chatState.titular;
  let report = `=== REPORTE MÉDICO COMPLETO DEL TITULAR ===\n`;
  report += `• F. Nacimiento: ${t.fnac || 'No provista'}\n`;
  report += `• Género asignado: ${t.genero || 'No especificado'}\n`;
  if (t.genero === 'Femenino') {
      report += `• Maternidad: ${t.maternidad || 'No solicitada'}\n`;
  }
  report += `• Ubicación / CP: ${t.cp || 'No provisto'}\n`;
  report += `• Ocupación Laboral: ${t.ocupacion || 'No provista'}\n`;
  report += `• Deporte/Riesgo regulado: ${t.deporte || 'Ninguno'}\n`;
  report += `• Antropometría: ${t.antro || 'No especificado'}\n`;
  report += `• Diagnóstico clínico: ${t.preexistencia || 'Sin preexistencias'}\n\n`;

  if (chatState.familiares.length > 0) {
      report += `=== DEPENDIENTES ADICIONALES REGISTRADOS (${chatState.familiares.length}) ===\n`;
      chatState.familiares.forEach((fam, idx) => {
          report += `[Familiar ${idx + 1}] ${fam.nombre || 'Asignado'}\n`;
          report += `  - Edad/F.Nac: ${fam.fnac || '—'}\n`;
          report += `  - Género: ${fam.genero || '—'}\n`;
          report += `  - Peso/Talla: ${fam.antro || '—'}\n`;
          report += `  - Historial Clínico: ${fam.preexistencia || 'Sin preexistencias'}\n`;
      });
  }
  return report;
}

function parseEdadParaCat(fechaStr) {
    if (!fechaStr) return '30 a 45';
    const clean = parseInt(fechaStr.split('-')[0]);
    if (isNaN(clean)) return '30 a 45';
    const edad = new Date().getFullYear() - clean;
    if (edad < 30) return 'Menos de 30';
    if (edad <= 45) return '30 a 45';
    if (edad <= 60) return '45 a 60';
    return 'Más de 60';
}

// ── Guardado final seguro en base de datos sin alterar columnas ──
async function finishFlow() {
  clearQuickReplies();
  document.getElementById('progress-pct').textContent = '100%';
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-label').textContent = 'Completado ✓';

  typing = true;
  showTyping();

  const t = chatState.titular;
  const notasFinales = compilarNotasExtendidas();
  const catEdad = parseEdadParaCat(t.fnac);

  try {
    const result = await KinsuAPI.createProspecto({
      nombre: t.nombre,
      telefono: t.tel,
      email: t.correo,
      tipo: 'salud',
      ciudad: t.cp || 'CDMX',
      edad: catEdad,
      preexistencia: t.preexistencia || 'Sin preexistencias',
      notas: notasFinales // Almacenamiento limpio encriptado dentro de Notas
    });
    folio = (result && result.folio) ? result.folio : ('S' + Date.now().toString().slice(-6));
  } catch(e) {
    console.error("Fallo de guardado real:", e);
    folio = 'S' + Date.now().toString().slice(-6);
  }

  sessionStorage.setItem('prospecto', JSON.stringify({
    nombre: t.nombre, tipo: 'salud', folio: folio, tel: t.tel, correo: t.correo
  }));

  setTimeout(() => {
    removeTyping();
    typing = false;
    
    addBubble(`¡Perfecto! 🎉 He guardado el perfil familiar completo de tu prospecto.<br><br>
    El folio asignado en tu base de datos es <strong>#${folio}</strong>.<br>
    Aquí tienes el mensaje de WhatsApp para notificarle:`);

    const waText = `Hola ${t.nombre}! Te registré en Kinsu para tu cotización del Seguro de Salud familiar. Ya ingresé el cuestionario detallado y los perfiles médicos de tus dependientes al sistema. Te contactarán hoy mismo sin compromiso. Folio de seguimiento: #${folio}`;
    const cleanTel = String(t.tel).replace(/[^0-9]/g, '');
    const waUrl = (cleanTel ? `https://wa.me/52${cleanTel}` : 'https://wa.me') + `?text=${encodeURIComponent(waText)}`;

    setTimeout(() => {
      const area = document.getElementById('chat-area');
      area.innerHTML += `
      <div class="flex justify-center mt-2 w-full animate-fade-in">
        <div class="bg-white border border-slate-200 rounded-2xl p-4 max-w-sm w-full text-[13px] text-[#0d1c2e] leading-relaxed shadow-sm">
          <p class="text-[10px] font-bold text-[#4575BA] uppercase tracking-wider mb-2">Mensaje listo para enviar</p>
          <p class="text-slate-600">${waText}</p>
        </div>
      </div>`;

      area.innerHTML += `
      <div class="flex justify-center gap-3 mt-4 flex-wrap w-full">
        <a href="${waUrl}" target="_blank" 
          class="flex items-center justify-center gap-2 h-12 px-6 bg-[#25d366] text-white rounded-full font-bold text-sm hover:opacity-90 active:scale-95 transition-all shadow-md">
          <span>Enviar por WhatsApp</span>
        </a>
        <a href="prospectos.html?success=true" 
          class="flex items-center justify-center h-12 px-6 bg-white border border-slate-200 text-[#4575BA] rounded-full font-bold text-sm hover:bg-slate-50 active:scale-95 transition-all shadow-sm">
          <span>Ver mis prospectos</span>
        </a>
      </div>`;
      
      scrollBottom();
      document.getElementById('chat-input').disabled = true;
      document.getElementById('send-btn').disabled = true;
    }, 600);
  }, 1000);
}

// Inicialización automática
setTimeout(askNextQuestion, 400);
</script>
</body>
</html>
