<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Kinsu - Bienvenido</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script id="tailwind-config">
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          kinsu: {
            blue: '#4575BA',
            blueDark: '#355c94',
            green: '#BFFD70',
            navy: '#0d1c2e'
          }
        }
      }
    }
  }
</script>
<style>
  body { font-family:'Inter',sans-serif; background:#f8fafc; padding-bottom:env(safe-area-inset-bottom); }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; vertical-align:middle; }
  
  /* Keyframes de Animaciones Premium Preservadas */
  @keyframes ringIn  { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  @keyframes checkIn { 0%{transform:scale(0) rotate(-15deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
  @keyframes fadeUp  { 0%{transform:translateY(12px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  
  .anim-ring  { animation:ringIn  .45s cubic-bezier(.36,.07,.19,.97) both; }
  .anim-check { animation:checkIn .3s .45s ease both; }
  .anim-fade1 { animation:fadeUp  .4s .6s  ease both; }
  .anim-fade2 { animation:fadeUp  .4s .75s ease both; }
  .anim-fade3 { animation:fadeUp  .4s .9s  ease both; }
</style>
</head>

<body class="text-kinsu-navy min-h-screen flex flex-col items-center justify-between antialiased bg-slate-50 px-4 overflow-x-hidden">

  <header class="w-full max-w-[420px] flex justify-center pt-12 pb-4">
    <span class="text-kinsu-blue font-black text-3xl tracking-tight select-none">Kinsu</span>
  </header>

  <main class="flex-grow flex flex-col items-center justify-center w-full max-w-[420px] py-6 text-center">

    <div class="mb-8 relative anim-ring">
      <div class="w-28 h-28 rounded-full bg-emerald-50 border border-emerald-100 flex items-center justify-center shadow-md">
        <span class="material-symbols-outlined anim-check text-emerald-600"
          style="font-size:56px;font-variation-settings:'FILL' 1;">
          check_circle
        </span>
      </div>
      <div class="absolute -top-1 -right-1 w-7 h-7 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-50">
        <div class="w-2.5 h-2.5 bg-kinsu-green rounded-full animate-pulse"></div>
      </div>
    </div>

    <div class="space-y-2 mb-8 anim-fade1">
      <h1 class="text-3xl font-black tracking-tight text-kinsu-navy leading-none" id="welcome-title">
        ¡Bienvenido de vuelta!
      </h1>
      <p class="text-sm font-semibold text-slate-400">
        Tu sesión ha sido iniciada con éxito.
      </p>
    </div>

    <div class="w-full bg-white border border-slate-100 rounded-3xl p-6 mb-8
                shadow-xl shadow-slate-200/40 flex flex-col items-center relative overflow-hidden anim-fade2">

      <div class="absolute top-0 left-0 w-1.5 h-full bg-kinsu-blue"></div>

      <div class="relative mb-4">
        <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center border border-blue-100/40 shadow-inner">
          <span id="user-initials" class="text-2xl font-black text-kinsu-blue tracking-tighter">JR</span>
        </div>
        <div class="absolute -bottom-1.5 right-0 bg-kinsu-green text-kinsu-navy text-[9px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full border border-white shadow-sm">
          Kinsurer
        </div>
      </div>

      <div class="space-y-0.5 mb-4">
        <h2 class="text-lg font-black text-kinsu-navy tracking-tight truncate max-w-[260px]" id="user-name">Jimena Ríos</h2>
        <p class="text-xs font-semibold text-slate-400 truncate max-w-[260px]" id="user-email">kinsurer@kinsu.mx</p>
      </div>

      <div class="flex items-center gap-2 bg-slate-50 border border-slate-100 px-3.5 py-1.5 rounded-full shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[10px] font-black uppercase tracking-wider text-slate-500">Expediente: Activo</span>
      </div>
    </div>

    <div class="w-full space-y-4 anim-fade3">
      <button onclick="goToDashboard()"
        class="w-full h-12 bg-kinsu-blue text-white font-bold text-sm rounded-xl
               shadow-md shadow-blue-900/10 hover:bg-kinsu-blueDark active:scale-[0.98] transition-all uppercase tracking-wider">
        Ir a mi dashboard
      </button>
      <p class="text-xs text-slate-400 font-semibold italic tracking-wide" id="redirect-msg">
        Redirigiendo automáticamente en 5 segundos...
      </p>
    </div>

  </main>

  <footer class="py-8 text-center w-full">
    <p class="text-[9px] font-black uppercase tracking-[.25em] text-slate-400 select-none">
      Seguridad Kinsu © 2026
    </p>
  </footer>

<script>
// ── Sincronizar e Inyectar Sesión Local Activa ──
const user = JSON.parse(
  sessionStorage.getItem('user') ||
  '{"nombre":"Jimena Ríos","email":"kinsurer@kinsu.mx","initials":"JR"}'
);

document.getElementById('user-name').textContent     = user.nombre   || 'Jimena Ríos';
document.getElementById('user-email').textContent    = user.email    || 'kinsurer@kinsu.mx';
document.getElementById('user-initials').textContent = user.initials || 'JR';

// Heurística de Género Estructural Preservada
const titulo = document.getElementById('welcome-title');
titulo.textContent = '¡Bienvenid' +
  (user.nombre && ['a','e','i'].includes(user.nombre.slice(-1).toLowerCase()) ? 'a' : 'o') +
  ' de vuelta!';

// ── Bucle de Redireccionamiento Automatizado ──
let secs = 5;
const msg   = document.getElementById('redirect-msg');
const timer = setInterval(() => {
  secs--;
  msg.textContent = secs > 0
    ? `Redirigiendo automáticamente en ${secs} segundo${secs !== 1 ? 's' : ''}...`
    : 'Redirigiendo...';
  if (secs <= 0) { clearInterval(timer); goToDashboard(); }
}, 1000);

function goToDashboard() {
  clearInterval(timer);
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
