<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Kinsu - Formación con Ana</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#eef2f9; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .ana-bubble  { border-radius:16px 16px 16px 4px; }
  .user-bubble { border-radius:16px 16px 4px 16px; }
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  .dot{width:6px;height:6px;border-radius:50%;background:#1565c0;display:inline-block;animation:blink 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .qr-chip{flex-shrink:0;padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
  .qr-primary{background:#1565c0;color:#fff}.qr-primary:hover{background:#1255a8}
  .qr-secondary{background:#fff;color:#1565c0;border:1.5px solid rgba(21,101,192,.2)}.qr-secondary:hover{background:#e8f0fe}
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- TOPBAR -->
<header class="bg-white/90 backdrop-blur-md fixed top-0 w-full z-50 border-b border-[#e8f0fe]">
  <div class="flex items-center justify-between px-4 h-16 max-w-2xl mx-auto">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='dashboard.html'" class="text-[#1565c0] hover:bg-slate-100 p-2 rounded-full transition-all">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 relative"
        style="background:linear-gradient(135deg,#1565c0 0%,#82d14b 100%);">
        <span class="text-white font-black text-base">A</span>
        <div class="absolute bottom-0 right-0 w-3 h-3 bg-[#82d14b] border-2 border-white rounded-full"></div>
      </div>
      <div>
        <p class="text-[13px] font-bold text-[#0d1c2e]">Ana de Kinsu</p>
        <div class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-[#82d14b] rounded-full"></span>
          <span class="text-[10px] text-slate-500 font-medium">Tu guía personal</span>
        </div>
      </div>
    </div>
    <span class="px-3 py-1 bg-[#d4f0a0] text-[#1a3a0a] rounded-full text-[10px] font-bold uppercase tracking-wider" id="nivel-badge">—</span>
  </div>
</header>

<!-- CHAT -->
<main class="flex-1 w-full max-w-2xl mx-auto pt-20 pb-44 px-4 flex flex-col gap-4 no-scrollbar overflow-y-auto" id="chat-area"></main>

<!-- QUICK REPLIES -->
<div class="fixed w-full max-w-2xl left-1/2 -translate-x-1/2 px-4 z-40" id="qr-container" style="bottom:100px;"></div>

<!-- INPUT -->
<div class="fixed bottom-0 left-0 w-full z-50">
  <div class="max-w-2xl mx-auto px-4 pb-6 pt-2">
    <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-2 shadow-lg flex items-center gap-2 border border-white">
      <input id="chat-input" type="text" placeholder="Escribe tu pregunta a Ana..."
        class="flex-1 bg-transparent border-none focus:ring-0 text-[14px] text-[#0d1c2e] placeholder:text-slate-400 px-2 outline-none">
      <button onclick="sendMsg()" id="send-btn"
        class="w-10 h-10 bg-[#1565c0] text-white rounded-full flex items-center justify-center shadow active:scale-90 transition-transform flex-shrink-0">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">arrow_upward</span>
      </button>
    </div>
  </div>
</div>

<script src="kinsu-config.js"></script>
<script>
// ── CONFIGURACIÓN GEMINI ──
// Obtén tu API key gratuita en: https://aistudio.google.com
const GEMINI_API_KEY = 'AIzaSyB12X0SsjCPOz8rP2zieqioXP5CBHNTh_0';
const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=' + GEMINI_API_KEY;

// ── Contexto del Kinsurer ──
const user     = JSON.parse(sessionStorage.getItem('user') || '{}');
const userName = (user.nombre || 'Kinsurer').split(' ')[0];
const nivel    = user.nivel    || 'Kinsurer Nuevo';
const kid      = user.kinsurerID || '';

document.getElementById('nivel-badge').textContent = nivel.replace('Kinsurer ', '');

// ── System prompt con contexto real ──
const SYSTEM_PROMPT = `Eres Ana de Kinsu, la guía personal de formación y soporte de los Kinsurers en México.

DATOS DEL KINSURER CON QUIEN HABLAS:
- Nombre: ${user.nombre || 'Kinsurer'}
- Nivel actual: ${nivel}
- ID: ${kid}

SOBRE KINSU (contexto para respuestas):
Kinsu es una plataforma donde personas normales (Kinsurers) refieren prospectos para Seguro de Gastos Médicos Mayores (GMM) y ganan comisiones según su nivel:
- Kinsurer Nuevo: Sin comisión. Debe completar formación básica.
- Kinsurer Certificado (1-4 pólizas): $200 MXN fijos por póliza emitida.
- Kinsurer Pro (5-14 pólizas): 15% de la prima neta del seguro.
- Kinsurer Elite (15-29 pólizas): 20% de la prima neta.
- Kinsurer Embajador (30+ pólizas): 25% de la prima neta.

PROCESO: El Kinsurer registra un prospecto → Kinsu cotiza y emite el seguro → El Kinsurer cobra su comisión cuando el prospecto paga.

TU ROL COMO ANA:
1. Guía de formación: explica cómo funciona Kinsu, el GMM, cómo hacer el pitch, cómo manejar objeciones.
2. Coach de ventas: ayuda a ${userName} a conseguir más prospectos y mejorar su tasa de conversión.
3. Soporte personal: resuelve dudas sobre el proceso, comisiones, niveles, requisitos.
4. Motivadora: celebra logros y da pasos concretos para avanzar.

PERSONALIDAD: Cálida, directa, experta. Respuestas cortas (máx 4 oraciones). Emojis con moderación. Siempre en español mexicano.

IMPORTANTE: Conoces el nivel de ${userName} (${nivel}). Personaliza tus respuestas en base a eso. Si es Nuevo, enfócate en que complete la formación. Si es Certificado, ayúdale a llegar a Pro. Si es Pro, ayúdale a ser Elite.`;

let history = [];
let busy    = false;

// ── UI ──
function scrollDown() {
  setTimeout(function() {
    var a = document.getElementById('chat-area');
    a.scrollTo({ top: a.scrollHeight, behavior: 'smooth' });
  }, 80);
}

function addBubble(text, side) {
  side = side || 'ana';
  var area = document.getElementById('chat-area');
  var html = text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<strong>$1</strong>');
  if (side === 'ana') {
    area.innerHTML += '<div class="flex items-end gap-2 max-w-[88%]">' +
      '<div class="w-8 h-8 rounded-full flex-shrink-0 self-start mt-1 flex items-center justify-center" style="background:linear-gradient(135deg,#1565c0 0%,#82d14b 100%);"><span class="text-white font-bold text-[11px]">A</span></div>' +
      '<div class="bg-white ana-bubble border border-[#b5d4f4] px-4 py-3 text-[14px] text-[#0d1c2e] leading-relaxed shadow-sm">' + html + '</div>' +
      '</div>';
  } else {
    area.innerHTML += '<div class="flex justify-end"><div class="bg-[#1565c0] text-white px-4 py-3 text-[14px] leading-relaxed max-w-[80%] user-bubble">' + html + '</div></div>';
  }
  scrollDown();
}

function showTyping() {
  document.getElementById('chat-area').innerHTML +=
    '<div class="flex items-end gap-2" id="typing-ind">' +
    '<div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center" style="background:rgba(21,101,192,.15);"><span class="text-[#1565c0] font-bold text-[11px]">A</span></div>' +
    '<div class="bg-white px-4 py-3 shadow-sm border border-[#b5d4f4]/40 ana-bubble"><div style="display:flex;gap:4px;align-items:center;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>' +
    '</div>';
  scrollDown();
}

function removeTyping() {
  var t = document.getElementById('typing-ind');
  if (t) t.remove();
}

function setQR(replies) {
  var c = document.getElementById('qr-container');
  if (!replies || !replies.length) { c.innerHTML = ''; return; }
  c.innerHTML = '<div class="flex gap-2 overflow-x-auto no-scrollbar py-2">' +
    replies.map(function(r, i) {
      return '<button class="qr-chip ' + (i === 0 ? 'qr-primary' : 'qr-secondary') + '" onclick="onQR(\'' + r.replace(/'/g,"\\'") + '\')">' + r + '</button>';
    }).join('') + '</div>';
}

function setDisabled(v) {
  document.getElementById('chat-input').disabled = v;
  document.getElementById('send-btn').disabled   = v;
}

// ── Llamar a Gemini ──
async function callAna(msg) {
  if (busy) return;
  busy = true;
  setDisabled(true);
  document.getElementById('qr-container').innerHTML = '';
  showTyping();

  // Agregar al historial
  history.push({ role: 'user', parts: [{ text: msg }] });

  try {
    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: history,
        generationConfig: {
          maxOutputTokens: 400,
          temperature: 0.8,
        }
      })
    });

    console.log('[Ana/Gemini] Status:', res.status);
    const data  = await res.json();
    console.log('[Ana/Gemini] Response:', JSON.stringify(data).slice(0, 300));
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text
      || data?.error?.message
      || data?.promptFeedback?.blockReason
      || 'Lo siento, no pude procesar tu pregunta. ¿Puedes intentarlo de nuevo?';

    removeTyping();
    history.push({ role: 'model', parts: [{ text: reply }] });
    addBubble(reply);

    // Quick replies contextuales según la respuesta
    var qrs = [];
    var r = reply.toLowerCase();
    if (r.includes('prospecto') || r.includes('referido') || r.includes('cliente'))
      qrs = ['¿Cómo hago el pitch?','¿Qué hago si no responde?','Dame un ejemplo'];
    else if (r.includes('comisión') || r.includes('nivel') || r.includes('póliza'))
      qrs = ['¿Cuándo me pagan?','¿Cómo subo de nivel?','¿Qué es la prima neta?'];
    else if (r.includes('salud') || r.includes('seguro') || r.includes('gmm'))
      qrs = ['¿Qué cubre el GMM?','¿Qué son preexistencias?','¿Cuánto cuesta?'];
    else
      qrs = ['¿Cómo consigo más prospectos?','¿Qué hago hoy para avanzar?','Tengo una duda'];

    setQR(qrs);

  } catch(e) {
    removeTyping();
    console.error('[Ana/Gemini] Error:', e);
    addBubble('Error: ' + e.message + ' — revisa la consola (F12)');
    setQR(['Intentar de nuevo']);
  } finally {
    busy = false;
    setDisabled(false);
  }
}

function sendMsg() {
  var inp = document.getElementById('chat-input');
  var val = inp.value.trim();
  if (!val || busy) return;
  inp.value = '';
  addBubble(val, 'user');
  callAna(val);
}

function onQR(val) {
  document.getElementById('qr-container').innerHTML = '';
  addBubble(val, 'user');
  callAna(val);
}

document.getElementById('chat-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMsg();
});

// ── Mensaje inicial personalizado por nivel ──
var INTRO_POR_NIVEL = {
  'Kinsurer Nuevo':      'Hola ' + userName + '! 👋 Soy Ana, tu guía en Kinsu. Para empezar a ganar comisiones necesitas completar tu formación básica. ¿Por dónde quieres empezar?',
  'Kinsurer Certificado':'Hola ' + userName + '! 👋 Estás en nivel Certificado ganando $200 MXN por póliza. Para llegar a Pro necesitas 5 pólizas emitidas — ¿quieres que te ayude a conseguir más prospectos?',
  'Kinsurer Pro':        'Hola ' + userName + '! 👋 Vas muy bien en nivel Pro con 15% de comisión. Para ser Elite necesitas 15 pólizas. ¿En qué te puedo ayudar hoy?',
  'Kinsurer Elite':      'Hola ' + userName + '! 👋 Eres Kinsurer Elite — lo estás haciendo increíble 🎉 ¿Cómo te puedo ayudar a llegar a Embajador?',
  'Kinsurer Embajador':  'Hola ' + userName + '! 👋 Eres Kinsurer Embajador — el nivel más alto de Kinsu. ¿En qué te puedo apoyar hoy?',
};

var introMsg = INTRO_POR_NIVEL[nivel] || ('Hola ' + userName + '! 👋 Soy Ana, tu guía personal en Kinsu. ¿En qué te puedo ayudar hoy?');

setTimeout(function() {
  // No llamamos a la API para el intro — lo mostramos directo para ahorrar tokens
  addBubble(introMsg);
  history.push({ role: 'model', parts: [{ text: introMsg }] });
  setQR(['¿Cómo consigo prospectos?', '¿Cómo funciona el GMM?', '¿Cómo subo de nivel?']);
}, 400);
</script>
</body>
</html>
