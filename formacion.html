<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Kinsu - Formación con Ana</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#eef2f9; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .ana-bubble  { border-radius:16px 16px 16px 4px; }
  .user-bubble { border-radius:16px 16px 4px 16px; }
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  .dot{width:6px;height:6px;border-radius:50%;background:#1565c0;display:inline-block;animation:blink 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .qr-chip{flex-shrink:0;padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
  .qr-primary{background:#1565c0;color:#fff}.qr-primary:hover{background:#1255a8}
  .qr-secondary{background:#fff;color:#1565c0;border:1.5px solid rgba(21,101,192,.2)}.qr-secondary:hover{background:#e8f0fe}
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- TOPBAR -->
<header class="bg-white/90 backdrop-blur-md fixed top-0 w-full z-50 border-b border-[#e8f0fe]">
  <div class="flex items-center justify-between px-4 h-16 max-w-2xl mx-auto">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='dashboard.html'" class="text-[#1565c0] hover:bg-slate-100 p-2 rounded-full transition-all">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 relative"
        style="background:linear-gradient(135deg,#1565c0 0%,#82d14b 100%);">
        <span class="text-white font-black text-base">A</span>
        <div class="absolute bottom-0 right-0 w-3 h-3 bg-[#82d14b] border-2 border-white rounded-full"></div>
      </div>
      <div>
        <p class="text-[13px] font-bold text-[#0d1c2e]">Ana de Kinsu</p>
        <div class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-[#82d14b] rounded-full"></span>
          <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Tu guía personal</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="px-3 py-1 bg-[#d4f0a0] text-[#1a3a0a] rounded-full text-[10px] font-bold uppercase tracking-wider" id="nivel-badge">Certificado</span>
    </div>
  </div>
</header>

<!-- CHAT -->
<main class="flex-1 w-full max-w-2xl mx-auto pt-20 pb-44 px-4 flex flex-col gap-4 no-scrollbar overflow-y-auto" id="chat-area"></main>

<!-- QUICK REPLIES -->
<div class="fixed w-full max-w-2xl left-1/2 -translate-x-1/2 px-4 z-40" id="qr-container" style="bottom:100px;"></div>

<!-- INPUT -->
<div class="fixed bottom-0 left-0 w-full z-50">
  <div class="max-w-2xl mx-auto px-4 pb-6 pt-2">
    <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-2 shadow-lg flex items-center gap-2 border border-white">
      <input id="chat-input" type="text" placeholder="Escribe tu pregunta a Ana..."
        class="flex-1 bg-transparent border-none focus:ring-0 text-[14px] text-[#0d1c2e] placeholder:text-slate-400 px-2 outline-none">
      <button onclick="sendMsg()" id="send-btn"
        class="w-10 h-10 bg-[#1565c0] text-white rounded-full flex items-center justify-center shadow active:scale-90 transition-transform flex-shrink-0">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">arrow_upward</span>
      </button>
    </div>
  </div>
</div>

<script src="kinsu-config.js"></script>
<script>
const user = JSON.parse(sessionStorage.getItem('user') || '{"nombre":"Kinsurer","nivel":"Kinsurer Certificado","kinsurerID":"KIN-0001"}');
const userName = user.nombre?.split(' ')[0] || 'Kinsurer';
const nivel    = user.nivel || 'Kinsurer Certificado';

document.getElementById('nivel-badge').textContent = nivel.replace('Kinsurer ','');

let history = [];
let busy    = false;

const ANA_SYSTEM = `Eres Ana de Kinsu, la guía personal de formación y soporte para Kinsurers en México.

SOBRE KINSU:
- Kinsu es una plataforma donde personas normales (Kinsurers) refieren prospectos para seguros de Salud (Gastos Médicos Mayores) y ganan comisiones.
- El proceso: Kinsurer registra un prospecto → Kinsu contacta al prospecto → Si compra, el Kinsurer gana su comisión.
- Solo se trabaja con Seguro de Salud (GMM).
- Comisión: $200 MXN fijos (Certificado), 15% (Pro), 20% (Elite), 25%+red (Embajador).

NIVELES KINSURER:
- Nuevo (0 pólizas): Sin comisión, necesita completar formación
- Certificado (1-4 pólizas): $200 MXN fijos
- Pro (5-14 pólizas): 15%
- Elite (15-29 pólizas): 20%
- Embajador (30+): 25% + bono de red

EL KINSURER ACTUAL se llama ${userName} y está en nivel ${nivel}.

TU ROL:
1. Guía de formación: explica cómo funciona Kinsu, el seguro de salud, cómo hacer el pitch, cómo manejar objeciones.
2. Soporte personal: responde cualquier duda sobre el proceso, comisiones, prospectos, niveles.
3. Coach de ventas: ayuda a ${userName} a mejorar su tasa de conversión con consejos prácticos.
4. Motivadora: celebra sus logros y lo impulsa a crecer.

PERSONALIDAD: Cálida, directa, experta. Usa ejemplos del mercado mexicano. Respuestas cortas (máx 4 oraciones). Usa emojis con moderación.
Responde SIEMPRE en español mexicano.`;

// UI
function scrollDown() { setTimeout(()=>{ const a=document.getElementById('chat-area'); a.scrollTo({top:a.scrollHeight,behavior:'smooth'}); },80); }

function addBubble(text, side='ana') {
  const area = document.getElementById('chat-area');
  const html = text.replace(/\n/g,'<br>').replace(/\*(.*?)\*/g,'<strong>$1</strong>');
  if(side==='ana') {
    area.innerHTML += `<div class="flex items-end gap-2 max-w-[88%]">
      <div class="w-8 h-8 rounded-full flex-shrink-0 self-start mt-1 flex items-center justify-center" style="background:linear-gradient(135deg,#1565c0 0%,#82d14b 100%);">
        <span class="text-white font-bold text-[11px]">A</span>
      </div>
      <div class="bg-white ana-bubble border border-[#b5d4f4] px-4 py-3 text-[14px] text-[#0d1c2e] leading-relaxed shadow-sm">${html}</div>
    </div>`;
  } else {
    area.innerHTML += `<div class="flex justify-end">
      <div class="bg-[#1565c0] text-white px-4 py-3 text-[14px] leading-relaxed max-w-[80%] user-bubble">${html}</div>
    </div>`;
  }
  scrollDown();
}

function showTyping() {
  document.getElementById('chat-area').innerHTML += `<div class="flex items-end gap-2" id="typing-ind">
    <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center" style="background:rgba(21,101,192,.15);">
      <span class="text-[#1565c0] font-bold text-[11px]">A</span>
    </div>
    <div class="bg-white px-4 py-3 shadow-sm border border-[#b5d4f4]/40 ana-bubble">
      <div style="display:flex;gap:4px;align-items:center;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </div>`;
  scrollDown();
}

function removeTyping() { document.getElementById('typing-ind')?.remove(); }

function setQR(replies) {
  const c = document.getElementById('qr-container');
  if(!replies?.length) { c.innerHTML=''; return; }
  c.innerHTML = `<div class="flex gap-2 overflow-x-auto no-scrollbar py-2">${replies.map((r,i)=>`<button class="qr-chip ${i===0?'qr-primary':'qr-secondary'}" onclick="onQR('${r.replace(/'/g,"\\'")}')">${r}</button>`).join('')}</div>`;
}

function setDisabled(v) {
  document.getElementById('chat-input').disabled = v;
  document.getElementById('send-btn').disabled   = v;
}

// ── Llamar a Ana ──
async function callAna(msg) {
  setDisabled(true);
  document.getElementById('qr-container').innerHTML='';
  showTyping();
  history.push({ role:'user', content:msg });

  try {
    const res  = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:600,
        system: ANA_SYSTEM,
        messages: history
      })
    });
    const data  = await res.json();
    const reply = data.content?.[0]?.text || 'Lo siento, hubo un error. Intenta de nuevo.';

    removeTyping();
    history.push({ role:'assistant', content:reply });
    addBubble(reply);

    // Quick replies contextuales
    if(reply.toLowerCase().includes('prospecto')||reply.toLowerCase().includes('referido')) {
      setQR(['¿Cómo hago el pitch?','¿Qué objeciones son comunes?','¿Cómo hago seguimiento?']);
    } else if(reply.toLowerCase().includes('comisión')||reply.toLowerCase().includes('nivel')) {
      setQR(['¿Cuándo me pagan?','¿Cómo subo de nivel?','Ver mis ganancias']);
    } else if(reply.toLowerCase().includes('salud')||reply.toLowerCase().includes('seguro')) {
      setQR(['¿Qué cubre el seguro?','¿Qué son preexistencias?','¿Cuánto cuesta?']);
    } else {
      setQR(['Tengo otra duda','Ayúdame a conseguir prospectos','¿Cómo mejoro?']);
    }

  } catch(e) {
    removeTyping();
    addBubble('Tuve un problema de conexión. ¿Puedes intentarlo de nuevo? 🙏');
    setQR(['Intentar de nuevo']);
  } finally {
    setDisabled(false);
  }
}

function sendMsg() {
  const inp = document.getElementById('chat-input');
  const val = inp.value.trim();
  if(!val||busy) return;
  inp.value = '';
  addBubble(val,'user');
  callAna(val);
}

function onQR(val) {
  if(val==='Ver mis ganancias') { window.location.href='ganancias.html'; return; }
  document.getElementById('chat-input').value='';
  document.getElementById('qr-container').innerHTML='';
  addBubble(val,'user');
  callAna(val);
}

document.getElementById('chat-input').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });

// ── Inicio ──
setTimeout(() => {
  callAna(`Hola Ana, soy ${userName}. Estoy en nivel ${nivel}. ¿Puedes ayudarme a entender cómo avanzar y ganar más comisiones con Kinsu?`);
}, 500);
</script>
</body>
</html>
