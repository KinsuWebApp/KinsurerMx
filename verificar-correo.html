<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Kinsu - Verificar Correo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="kinsu-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script id="tailwind-config">
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          kinsu: {
            blue: '#4575BA',
            blueDark: '#355c94',
            green: '#BFFD70',
            navy: '#0d1c2e'
          }
        }
      }
    }
  }
</script>
<style>
  body { font-family:'Inter',sans-serif; background:#f8fafc; padding-bottom:env(safe-area-inset-bottom); }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; vertical-align:middle; }
  
  /* Cajas OTP Estilizadas de Alta Fidelidad */
  .otp-input {
    width: 48px !important;
    height: 58px !important;
    text-align: center !important;
    font-size: 22px !important;
    font-weight: 800 !important;
    background: #f1f5f9 !important;
    border: 1.5px solid #e2e8f0 !important;
    border-radius: 14px !important;
    color: #0d1c2e !important;
    outline: none !important;
    transition: all .15s;
    padding: 0 !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-shrink: 0 !important;
  }
  .otp-input:focus {
    background: #fff !important;
    border-color: #4575BA !important;
    box-shadow: 0 0 0 4px rgba(69, 117, 186, 0.15) !important;
  }
  .otp-input.filled { background: #fff !important; border-color: #4575BA !important; }
  .otp-input.error-inp { background: #fff8f8 !important; border-color: #ef4444 !important; box-shadow: 0 0 0 2px #ef4444 !important; }
  #resend-btn:disabled { opacity: .45; cursor: not-allowed; text-decoration: none; }
</style>
</head>

<body class="text-kinsu-navy min-h-screen flex flex-col items-center antialiased bg-slate-50 px-4">

  <header class="w-full max-w-[420px] flex items-center justify-between pt-12 pb-6">
    <button onclick="window.location.href='registro.html'"
      class="w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-slate-100 shadow-sm text-kinsu-blue hover:bg-slate-50 transition-colors active:scale-95">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <span class="text-kinsu-blue font-black text-3xl tracking-tight select-none">Kinsu</span>
    <div class="w-10"></div>
  </header>

  <main class="w-full max-w-[420px] px-1 flex-grow">

    <div class="mb-6">
      <div class="flex justify-between items-end mb-2.5">
        <span class="text-slate-400 text-xs font-bold uppercase tracking-wider">Verificación</span>
        <span class="text-slate-400 text-xs font-bold uppercase tracking-wider">Paso 2 de 2</span>
      </div>
      <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full w-full bg-kinsu-blue rounded-full"></div>
      </div>
    </div>

    <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-xl shadow-slate-200/40 flex flex-col relative overflow-hidden">
      <div class="absolute -right-12 -top-12 w-32 h-32 bg-kinsu-blue/5 rounded-full blur-xl pointer-events-none"></div>

      <h1 class="text-2xl font-black tracking-tight text-kinsu-navy leading-tight mb-2">Revisa tu correo</h1>
      <p class="text-xs text-slate-500 font-medium leading-relaxed mb-6">
        Enviamos un código de seguridad de 5 dígitos a <span class="font-black text-kinsu-blue" id="otp-email">tu correo</span>. 
        Revisa tu bandeja de entrada o carpeta de spam.
      </p>

      <div id="otp-error" class="hidden mb-4 bg-rose-50 border border-rose-100 rounded-xl px-4 py-3 flex items-center gap-2.5 animate-fade-in">
        <span class="material-symbols-outlined text-[#ef4444] text-lg flex-shrink-0">error</span>
        <p class="text-xs text-[#b91c1c] font-bold" id="otp-error-msg">Código incorrecto. Verifica e intenta de nuevo.</p>
      </div>

      <div class="flex justify-center gap-2.5 mb-6" id="otp-container">
        <input class="otp-input" maxlength="1" type="text" inputmode="numeric" autocomplete="one-time-code">
        <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
        <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
        <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
        <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
      </div>

      <div class="text-center mb-6">
        <button id="resend-btn" onclick="startCountdown()" disabled
          class="text-xs font-bold text-kinsu-blue hover:underline transition-all uppercase tracking-wider">
          Reenviar código (<span id="countdown">60</span>s)
        </button>
      </div>

      <button id="verify-btn" onclick="verifyOTP()"
        class="w-full h-12 bg-kinsu-blue text-white rounded-xl font-bold text-sm
               shadow-md shadow-blue-900/10 active:scale-[0.98] transition-all 
               flex items-center justify-center gap-1.5 uppercase tracking-wider">
        <span id="verify-txt">Verificar y entrar</span>
        <span class="material-symbols-outlined text-base" id="verify-ico">arrow_forward</span>
      </button>
    </div>

    <div class="mt-6 flex justify-center">
      <div class="flex items-center gap-2 text-emerald-800 bg-emerald-50 border border-emerald-100 px-4 py-1.5 rounded-full select-none shadow-sm">
        <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1;">security</span>
        <span class="text-[10px] font-black uppercase tracking-wider">Conexión Segura</span>
      </div>
    </div>

  </main>

  <footer class="mt-auto py-8 text-center w-full">
    <p class="text-[9px] font-black uppercase tracking-[.25em] text-slate-400 select-none">
      Seguridad Kinsu © 2026
    </p>
  </footer>

<script>
// Recuperar estados de transferencia desde la memoria del navegador
const regEmail = sessionStorage.getItem('reg-email') || 'tu correo';
const regName  = sessionStorage.getItem('reg-name')  || 'Kinsurer';
document.getElementById('otp-email').textContent = regEmail;

// Captura e indexación de inputs OTP
const inputs = Array.from(document.querySelectorAll('.otp-input'));

inputs.forEach((inp, i) => {
  inp.addEventListener('input', e => {
    // Forzar exclusivamente caracteres numéricos
    inp.value = inp.value.replace(/[^0-9]/g,'').slice(-1);
    inp.classList.toggle('filled', inp.value !== '');
    
    // Auto-avance al siguiente casillero
    if (inp.value && i < inputs.length - 1) inputs[i+1].focus();
    
    // Disparador inteligente automático al rellenar los 5 dígitos requirientes
    const code = inputs.map(el => el.value).join('');
    if (code.length === 5) verifyOTP();
  });

  inp.addEventListener('keydown', e => {
    // Borrado inteligente y retroceso de foco táctil
    if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
  });

  inp.addEventListener('paste', e => {
    e.preventDefault();
    const paste = (e.clipboardData || window.clipboardData)
                  .getData('text').replace(/[^0-9]/g,'');
    paste.split('').forEach((ch, j) => {
      if (inputs[i+j]) {
        inputs[i+j].value = ch;
        inputs[i+j].classList.add('filled');
      }
    });
    const next = inputs[Math.min(i + paste.length, inputs.length-1)];
    next.focus();
  });
});

// ── PROCESAMIENTO NATIVO DE VERIFICACIÓN CENTRAL ──
async function verifyOTP() {
  const code  = inputs.map(el => el.value).join('');
  const errEl = document.getElementById('otp-error');
  const btn   = document.getElementById('verify-btn');

  errEl.classList.add('hidden');
  inputs.forEach(el => el.classList.remove('error-inp'));

  if (code.length < 5) return;

  // Estado visual de carga (Failsafe anti doble click)
  btn.disabled = true;
  btn.style.opacity = '.75';
  document.getElementById('verify-txt').textContent = 'Verificando...';
  document.getElementById('verify-ico').textContent = 'hourglass_empty';

  const params  = new URLSearchParams(location.search);
  const email   = params.get('email') || sessionStorage.getItem('reg-email') || '';
  const pending = JSON.parse(sessionStorage.getItem('registro-pending') || '{}');

  try {
    // 1. Despacho hacia el backend remoto para auditar el token OTP de un solo uso
    const result = await KinsuAPI.verifyOTP(email || pending.email, code);

    if (result?.error) {
      inputs.forEach(el => { el.value = ''; el.classList.add('error-inp'); });
      inputs[0].focus();
      errEl.classList.remove('hidden');
      const msgLabel = document.getElementById('otp-error-msg');
      if (msgLabel) msgLabel.textContent = result.error;
      
      btn.disabled = false; btn.style.opacity = '1';
      document.getElementById('verify-txt').textContent = 'Verificar código';
      document.getElementById('verify-ico').textContent = 'arrow_forward';
      return;
    }

    // 2. Token exitoso: Ejecutamos el alta definitiva de la fila del Kinsurer en Sheets
    document.getElementById('verify-txt').textContent = 'Creando cuenta...';
    const createResult = await KinsuAPI.createKinsurer({
      nombre:   pending.nombre   || result.nombre || '',
      email:    pending.email    || email,
      telefono: pending.telefono || '',
      password: pending.password || '',
    });

    if (createResult?.error) {
      errEl.classList.remove('hidden');
      const msgLabel = document.getElementById('otp-error-msg');
      if (msgLabel) msgLabel.textContent = createResult.error;
      btn.disabled = false; btn.style.opacity = '1';
      document.getElementById('verify-txt').textContent = 'Verificar código';
      document.getElementById('verify-ico').textContent = 'arrow_forward';
      return;
    }

    // 3. Sincronizar e inyectar sesión local en el navegador del dispositivo
    sessionStorage.removeItem('registro-pending');
    sessionStorage.setItem('user', JSON.stringify({
      nombre:      createResult.nombre || pending.nombre,
      email:       createResult.email  || pending.email,
      initials:    (createResult.nombre || pending.nombre || '').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2),
      kinsurerID:  createResult.kinsurerID,
      nivel:       'Kinsurer Nuevo',
      clabe:       '',
      banco:       '',
    }));

    window.location.href = 'login-exitoso.html';

  } catch(e) {
    console.warn('Error crítico en el canal de verificación OTP:', e);
    errEl.classList.remove('hidden');
    const msgLabel = document.getElementById('otp-error-msg');
    if (msgLabel) msgLabel.textContent = 'Error de conexión. Intenta de nuevo.';
    btn.disabled = false; btn.style.opacity = '1';
    document.getElementById('verify-txt').textContent = 'Verificar código';
    document.getElementById('verify-ico').textContent = 'arrow_forward';
  }
}

// ── CONTROL DE TEMPORIZADOR DE SEGURIDAD REENVÍO ──
let cdTimer = null;
function startCountdown() {
  const btn = document.getElementById('resend-btn');
  const cd  = document.getElementById('countdown');
  if (cdTimer) clearInterval(cdTimer);
  let secs = 60;
  btn.disabled = true;
  cd.textContent = secs;
  cdTimer = setInterval(() => {
    secs--;
    cd.textContent = secs;
    if (secs <= 0) {
      clearInterval(cdTimer);
      btn.disabled = false;
      cd.textContent = '60';
    }
  }, 1000);
}
startCountdown();
</script>
</body>
</html>
